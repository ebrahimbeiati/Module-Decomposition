<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Chat App</title>
  </head>
  <body>
    <div class="chat-container">
    <ul id="messages-list"></ul>
    <form id="message-form">
      <input
        type="text"
        id="username-input"
        placeholder="Your name..."
        aria-label="Your name"
        required
      />
      <div class="chat-footer">
        <div class="input-wrapper">
          <!-- The Popover Picker Container -->
          <div id="picker-container" class="picker-hidden"></div>
          <!-- Text Input -->
          <input type="text" id="chat-input" placeholder="Message" aria-label="Message" autocomplete="off" required>
          <!-- Trigger Button -->
          <button id="emoji-btn" type="button">😀</button>
        </div>
      
        <button id="send-btn" type="submit">Send</button>
      </div>
    </form>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
